services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: swiss_companies
      POSTGRES_USER: swiss
      POSTGRES_PASSWORD: swiss
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
